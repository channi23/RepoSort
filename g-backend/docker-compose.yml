services:
  postgres:
    image: postgres:16
    container_name: gemini_postgres
    environment:
      POSTGRES_USER: gemini
      POSTGRES_PASSWORD: gemini
      POSTGRES_DB: gemini
    ports:
      - "5433:5432"
    volumes:
      - gemini_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: gemini_redis
    ports:
      - "6379:6379"
    volumes: 
      - gemini_redis:/data
volumes:
  gemini_pg:
  gemini_redis:


